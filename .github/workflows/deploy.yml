# Builds Steady and publishes it to GitHub Pages.
#
# This is why there is no dist/ folder in the repo: dist/ is build output, and
# committing build output means it goes stale the moment anyone edits the source.
# Instead GitHub rebuilds it here on every push, and publishes the result.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-notes-task-tracker-gjn5gs, main]
  # Lets you re-deploy by hand from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the newer deploy and drop the older one,
# rather than queueing them and publishing them out of order.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to the exact commit their version tag pointed at when it
# was checked (with `git ls-remote https://github.com/actions/<name>`), so a
# moved tag cannot change what runs here. The comment names the version.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should fail here, loudly, rather than quietly publishing
      # something that does not work.
      - run: npm test

      # GitHub Pages serves a normal ("project") repo at /<repo-name>/ rather
      # than at the domain root, and the app has to be built knowing that or
      # every path in it points one level too high. A user site, named
      # <your-username>.github.io, IS served at the root - hence the check.
      - name: Work out the base path
        id: base
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "Serving from the domain root."
          else
            echo "path=$REPO" >> "$GITHUB_OUTPUT"
            echo "Serving from /$REPO/."
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}

      # The privacy gate: reads exactly the files about to be published and
      # stops here if any could send data anywhere, or if the page's security
      # policy has been loosened. Nothing is uploaded unless this passes.
      - name: Privacy check
        run: npm run privacy

      # Stops GitHub trying to run the output through Jekyll, which would drop
      # any file whose name starts with an underscore.
      - run: touch dist/.nojekyll

      # Deliberately NOT using `enablement: true`. It looks like it should save
      # a manual step, but the workflow's GITHUB_TOKEN is not allowed to create
      # a Pages site - the attempt fails with "Resource not accessible by
      # integration", which is far more confusing than the plain "Pages is not
      # enabled" error you get without it. Pages has to be switched on once by
      # hand; after that this step just reads the settings.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Explain why Pages failed
        if: failure()
        run: |
          echo "::error title=GitHub Pages is not switched on for this repository::"
          echo "This step reads your Pages settings, and there are none yet."
          echo ""
          echo "Fix it once, by hand - it takes about ten seconds:"
          echo "  1. Open https://github.com/$GITHUB_REPOSITORY/settings/pages"
          echo "  2. Under 'Build and deployment', set Source to 'GitHub Actions'"
          echo "  3. Re-run this workflow"
          echo ""
          echo "If that page shows an upgrade prompt instead of a Source dropdown,"
          echo "the repository is private and GitHub Pages on a private repository"
          echo "requires GitHub Pro. Either make the repository public, or deploy to"
          echo "Cloudflare Pages instead - free, and it supports private repos."
          echo "See DEPLOY.md, Option B."

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
